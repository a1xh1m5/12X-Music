<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lossless Core | v3.0</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@uimaxbai/am-lyrics/dist/src/am-lyrics.min.js"></script>

  <style>
    :root {
      --bg: #000;
      --card: #121212;
      --accent: #fff;
      --green: #1DB954;
      --text-dim: rgba(255,255,255,0.5);
      --border: rgba(255,255,255,0.08);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { 
      margin: 0; background: var(--bg); color: #fff; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      height: 100dvh; overflow: hidden;
    }

    /* ── LAYOUT ── */
    .tab-content {
      height: 100dvh; overflow-y: auto; 
      padding: calc(var(--safe-t) + 20px) 20px 220px; 
      display: none; scroll-behavior: smooth;
    }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .section-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 24px; letter-spacing: -0.04em; display: flex; align-items: center; justify-content: space-between; }

    /* ── GRIDS & CARDS ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .card { background: var(--card); border-radius: 14px; padding: 12px; border: 1px solid var(--border); transition: transform 0.2s; position: relative; }
    .card:active { transform: scale(0.97); }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover; margin-bottom: 10px; background: #1a1a1a; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .t-name { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 3px; }

    /* ── BOTTOM NAV ── */
    #tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(75px + var(--safe-b)); background: rgba(0,0,0,0.94);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid var(--border); display: flex; justify-content: space-around; 
      align-items: center; padding-bottom: var(--safe-b); z-index: 2000;
    }
    .tab-btn { background: none; border: none; color: #777; display: flex; flex-direction: column; align-items: center; font-size: 0.65rem; font-weight: 700; gap: 5px; transition: 0.2s; }
    .tab-btn.active { color: var(--accent); }
    .tab-btn svg { width: 24px; height: 24px; }

    /* ── MINI PLAYER ── */
    #mini-player {
      position: fixed; bottom: calc(85px + var(--safe-b)); left: 10px; right: 10px;
      height: 60px; background: #1e1e1e; border-radius: 12px;
      display: flex; align-items: center; padding: 0 12px; z-index: 1000;
      border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #m-art { width: 44px; height: 44px; border-radius: 6px; background: #333; object-fit: cover; }
    #m-meta { flex: 1; margin: 0 12px; overflow: hidden; cursor: pointer; }

    /* ── SEARCH ── */
    .search-container { position: sticky; top: 0; z-index: 100; background: var(--bg); padding-bottom: 15px; }
    #search-bar { width: 100%; background: #161616; border: 1px solid #222; border-radius: 12px; padding: 15px; color: #fff; font-family: inherit; font-size: 1rem; }

    /* ── FULL NOW PLAYING UI ── */
    #full-player {
      position: fixed; inset: 0; background: #000; z-index: 3000;
      transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      display: flex; flex-direction: column; padding: calc(var(--safe-t) + 10px) 30px var(--safe-b);
    }
    #full-player.active { transform: translateY(0); }
    
    .player-header { display: flex; justify-content: space-between; align-items: center; height: 60px; }
    .big-art-container { width: 100%; aspect-ratio: 1; margin: 20px 0; perspective: 1000px; }
    #big-art { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
    
    .player-meta { margin-top: 10px; }
    #big-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; }
    #big-artist { font-size: 1.1rem; color: var(--text-dim); margin-top: 5px; }

    .player-controls { margin-top: 40px; display: flex; flex-direction: column; gap: 30px; }
    .scrub-bar { width: 100%; height: 4px; background: #333; border-radius: 2px; position: relative; }
    #progress-fill { position: absolute; height: 100%; background: #fff; border-radius: 2px; width: 0%; }
    
    .glyph-btns { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
    .glyph-btns svg { width: 32px; height: 32px; fill: currentColor; }
    .play-trigger { width: 70px; height: 70px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    /* ── ACTION MENU ── */
    #action-menu {
      position: fixed; bottom: 0; left: 0; right: 0; background: #161616;
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      padding: 20px; z-index: 4000; transform: translateY(100%); transition: 0.3s;
    }
    #action-menu.active { transform: translateY(0); }
    .menu-item { padding: 18px; display: flex; align-items: center; gap: 15px; font-weight: 600; border-bottom: 1px solid #222; }
    .menu-item svg { width: 20px; opacity: 0.7; }

    /* ── LYRICS OVERLAY ── */
    #lyrics-view { position: absolute; inset: 0; background: #000; z-index: 10; display: none; padding: 40px 20px; }
    am-lyrics { height: 100%; --am-lyrics-font-size: 2.2rem; }
  </style>
</head>
<body>

  <div id="home" class="tab-content active">
    <div class="section-title">Recently Played <span style="font-size: 0.8rem; opacity: 0.4;">Clear History</span></div>
    <div id="recent-grid" class="grid"></div>
  </div>

  <div id="discover" class="tab-content">
    <div class="section-title">Hottest Hits <div id="loading-dots" style="display:none">...</div></div>
    <div id="discover-grid" class="grid"></div>
  </div>

  <div id="search" class="tab-content">
    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Search for songs...">
    </div>
    <div id="search-results" class="grid"></div>
  </div>

  <div id="library" class="tab-content">
    <div class="section-title">Your Library <button onclick="app.lib.createPlaylist()" style="background:none; border:none; color:var(--green); font-weight:800;">+ New</button></div>
    <div id="library-grid" class="grid"></div>
  </div>

  <div id="modules" class="tab-content">
    <div class="section-title">8SPINE Modules</div>
    <div id="module-list"></div>
    <button class="card" style="width:100%; border:1px dashed #444; margin-top:20px;" onclick="$('mod-input').click()">+ Load .8SPINE Module</button>
  </div>

  <div id="mini-player">
    <img id="m-art" src="" alt="" onclick="app.ui.openFull()">
    <div id="m-meta" onclick="app.ui.openFull()">
      <div id="m-title" class="t-name">Not Playing</div>
      <div id="m-artist" class="t-sub">Select a track</div>
    </div>
    <button onclick="app.togglePlay()" style="background:none; border:none; color:#fff;">
      <svg id="m-play-icon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <nav id="tab-bar">
    <button class="tab-btn active" onclick="app.ui.tab('home')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</button>
    <button class="tab-btn" onclick="app.ui.tab('discover')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>Discover</button>
    <button class="tab-btn" onclick="app.ui.tab('search')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>Search</button>
    <button class="tab-btn" onclick="app.ui.tab('library')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>Library</button>
    <button class="tab-btn" onclick="app.ui.tab('modules')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 12c0-1.1-.9-2-2-2h-3c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2v-3zM10 12c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2v-3zM10 4c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2V4zm10 0c0-1.1-.9-2-2-2h-3c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2V4z"/></svg>Modules</button>
  </nav>

  <div id="full-player">
    <div class="player-header">
      <button onclick="app.ui.closeFull()" style="background:none; border:none; color:#fff;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      <div style="font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; opacity: 0.5;">NOW PLAYING</div>
      <button onclick="app.ui.openMenu()" style="background:none; border:none; color:#fff;"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    </div>
    
    <div class="big-art-container">
        <img id="big-art" src="">
        <div id="lyrics-view"><am-lyrics id="amLyrics"></am-lyrics></div>
    </div>

    <div class="player-meta">
      <div id="big-title">No Track Selected</div>
      <div id="big-artist">Pick a song to begin</div>
    </div>

    <div class="player-controls">
      <div class="scrub-bar"><div id="progress-fill"></div></div>
      <div class="glyph-btns">
        <svg onclick="app.prev()" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        <div class="play-trigger" onclick="app.togglePlay()">
            <svg id="big-play-icon" viewBox="0 0 24 24" style="width:40px; height:40px;"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <svg onclick="app.next()" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z"/></svg>
      </div>
    </div>
  </div>

  <div id="action-menu">
    <div class="menu-item" onclick="app.ui.toggleLyrics()">Show Lyrics</div>
    <div class="menu-item" onclick="app.lib.addToPlaylistPrompt()">Add to Playlist</div>
    <div class="menu-item" onclick="app.download()">Download Song</div>
    <div class="menu-item" style="color:#ff4444;" onclick="app.ui.closeMenu()">Cancel</div>
  </div>

  <input type="file" id="mod-input" hidden accept=".8spine,.js">

  <script>
    const $ = id => document.getElementById(id);

    class LosslessCore {
      constructor() {
        this.audio = new Audio();
        this.currentTrack = null;
        this.history = JSON.parse(localStorage.getItem('lc_history') || '[]');
        this.playlists = JSON.parse(localStorage.getItem('lc_playlists') || '{"Favorites":[]}');
        this.modules = [];
        
        this.ui = {
          tab: id => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            $(id).classList.add('active');
            event.currentTarget.classList.add('active');
          },
          openFull: () => $('full-player').classList.add('active'),
          closeFull: () => $('full-player').classList.remove('active'),
          openMenu: () => $('action-menu').classList.add('active'),
          closeMenu: () => $('action-menu').classList.remove('active'),
          toggleLyrics: () => {
            const v = $('lyrics-view');
            v.style.display = v.style.display === 'block' ? 'none' : 'block';
            this.ui.closeMenu();
          }
        };

        this.lib = {
          createPlaylist: () => {
            const name = prompt("Playlist name?");
            if(name) { this.playlists[name] = []; this.save(); this.renderLibrary(); }
          },
          addToPlaylistPrompt: () => {
            const names = Object.keys(this.playlists);
            const choice = prompt("Target Playlist:\n" + names.join(", "));
            if(this.playlists[choice]) {
              this.playlists[choice].push(this.currentTrack);
              this.save();
              alert("Added!");
              this.ui.closeMenu();
            }
          }
        };

        this.init();
      }

      init() {
        $('search-bar').oninput = e => this.search(e.target.value);
        $('mod-input').onchange = e => this.loadMod(e.target.files[0]);
        this.audio.ontimeupdate = () => {
          const p = (this.audio.currentTime / this.audio.duration) * 100;
          $('progress-fill').style.width = p + '%';
        };
        this.fetchHottest();
        this.renderHistory();
        this.renderLibrary();
      }

      save() {
        localStorage.setItem('lc_history', JSON.stringify(this.history));
        localStorage.setItem('lc_playlists', JSON.stringify(this.playlists));
      }

      async fetchHottest() {
        $('loading-dots').style.display = 'inline';
        const res = await fetch(`https://itunes.apple.com/search?term=trending&entity=song&limit=10`);
        const data = await res.json();
        $('discover-grid').innerHTML = data.results.map(t => this.trackTemplate(t)).join('');
        $('loading-dots').style.display = 'none';
      }

      trackTemplate(t) {
        const art = t.artworkUrl100 ? t.artworkUrl100.replace('100x100','600x600') : '';
        return `
          <div class="card" onclick="app.play('${t.trackName.replace(/'/g,"")}','${t.artistName.replace(/'/g,"")}','${art}')">
            <img src="${t.artworkUrl100}">
            <div class="t-name">${t.trackName}</div>
            <div class="t-sub">${t.artistName}</div>
          </div>
        `;
      }

      play(title, artist, art) {
        this.currentTrack = { title, artist, art };
        
        // Update History
        this.history = [this.currentTrack, ...this.history.filter(i => i.title !== title)].slice(0, 12);
        this.save();
        this.renderHistory();

        // Update UI
        $('m-title').textContent = title; $('m-artist').textContent = artist; $('m-art').src = art;
        $('big-title').textContent = title; $('big-artist').textContent = artist; $('big-art').src = art;
        
        // Audio Logic (Placeholder for real stream)
        this.audio.src = ""; // Modules will fill this
        this.playing = true;
        this.updatePlayIcons();
      }

      togglePlay() {
        if(this.playing) { this.audio.pause(); this.playing = false; }
        else { this.audio.play(); this.playing = true; }
        this.updatePlayIcons();
      }

      updatePlayIcons() {
        const icon = this.playing ? 
          '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : 
          '<path d="M8 5v14l11-7z"/>';
        $('m-play-icon').innerHTML = icon;
        $('big-play-icon').innerHTML = icon;
      }

      async search(q) {
        if(q.length < 3) return;
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=15`);
        const data = await res.json();
        $('search-results').innerHTML = data.results.map(t => this.trackTemplate(t)).join('');
      }

      renderHistory() {
        $('recent-grid').innerHTML = this.history.map(t => `
          <div class="card" onclick="app.play('${t.title}','${t.artist}','${t.art}')">
            <img src="${t.art}">
            <div class="t-name">${t.title}</div>
            <div class="t-sub">${t.artist}</div>
          </div>
        `).join('');
      }

      renderLibrary() {
        $('library-grid').innerHTML = Object.keys(this.playlists).map(p => `
          <div class="card" style="background:#1a1a1a;">
            <div style="height:140px; display:flex; align-items:center; justify-content:center; font-size:3rem;">📁</div>
            <div class="t-name">${p}</div>
            <div class="t-sub">${this.playlists[p].length} songs</div>
          </div>
        `).join('');
      }

      download() {
          alert("Preparing high-bitrate download...");
          this.ui.closeMenu();
      }
    }

    const app = new LosslessCore();

    // 8SPINE Bridge Integration
    window._bridge = {
        updateMeta: (t, a, alb, art) => app.play(t, a, art),
        setAudioUrl: (url) => { app.audio.src = url; app.audio.play(); app.playing = true; app.updatePlayIcons(); }
    };
  </script>
</body>
</html>
