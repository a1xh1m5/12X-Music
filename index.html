<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Core | 8SPINE Engine</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@uimaxbai/am-lyrics/dist/src/am-lyrics.min.js"></script>

  <style>
    :root {
      --bg: #000;
      --card: #111;
      --accent: #fff;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; overflow: hidden; }

    /* Layout & Tabs */
    .tab-content { height: 100dvh; overflow-y: auto; padding: calc(var(--safe-t) + 20px) 20px 180px; display: none; }
    .tab-content.active { display: block; }
    
    /* Design Overhaul: Tighter & Smaller UI */
    .section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; letter-spacing: -0.02em; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    
    .card { background: var(--card); border-radius: 12px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; margin-bottom: 8px; }
    .track-name { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-sub { font-size: 0.75rem; opacity: 0.5; }

    /* Mini Player: Spotify-style Floating Dock */
    #mini-player {
      position: fixed; bottom: calc(85px + var(--safe-b)); left: 10px; right: 10px;
      height: 56px; background: rgba(20,20,20,0.9); backdrop-filter: blur(20px);
      border-radius: 10px; display: flex; align-items: center; padding: 0 10px; z-index: 1000;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Tab Bar: 5-Button Remake */
    #tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(75px + var(--safe-b)); background: rgba(0,0,0,0.95);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-around; align-items: center;
      padding-bottom: var(--safe-b); z-index: 1500;
    }
    .tab-item { background: none; border: none; color: #888; display: flex; flex-direction: column; align-items: center; font-size: 0.6rem; font-weight: 600; gap: 4px; }
    .tab-item.active { color: #fff; }
    .tab-item svg { width: 22px; height: 22px; }

    /* Player Overlay */
    #player-overlay {
      position: fixed; inset: 0; background: #000; z-index: 2000;
      transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.3, 1, 0.2, 1);
      padding: calc(var(--safe-t) + 20px) 25px;
    }
    #player-overlay.active { transform: translateY(0); }

    /* Search Input */
    .search-wrap { position: sticky; top: 0; background: #000; padding: 10px 0; z-index: 10; }
    #search-bar { width: 100%; background: #1a1a1a; border: none; border-radius: 8px; padding: 12px; color: #fff; font-family: inherit; }

    /* Module List */
    .module-item { background: #111; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>

  <div id="home" class="tab-content active">
    <h2 class="section-title">Recently Played</h2>
    <div id="recent-list" class="grid-container"></div>
  </div>

  <div id="discover" class="tab-content">
    <h2 class="section-title">Hottest Hits</h2>
    <div id="discover-list" class="grid-container"></div>
  </div>

  <div id="search" class="tab-content">
    <div class="search-wrap">
      <input type="text" id="search-bar" placeholder="Search for songs...">
    </div>
    <div id="search-results" class="grid-container"></div>
  </div>

  <div id="library" class="tab-content">
    <h2 class="section-title">Your Library</h2>
    <div id="library-folders">
       <div class="module-item" style="border: 1px dashed #333;" onclick="document.getElementById('playlist-input').click()">+ Create Playlist</div>
    </div>
  </div>

  <div id="modules" class="tab-content">
    <h2 class="section-title">Active Modules</h2>
    <div id="module-list"></div>
    <button class="card" style="width:100%; margin-top:20px; color:var(--accent);" onclick="document.getElementById('module-input').click()">Import .8SPINE Module</button>
  </div>

  <div id="mini-player" onclick="core.ui.openPlayer()">
    <img id="mini-art" src="" style="width:40px; height:40px; border-radius:4px; background:#222;">
    <div style="flex:1; margin-left:12px; overflow:hidden;">
        <div id="mini-title" class="track-name">No Media</div>
        <div id="mini-artist" class="track-sub">Select a track</div>
    </div>
    <button id="mini-play" style="background:none; border:none; color:#fff;"><svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  </div>

  <nav id="tab-bar">
    <button class="tab-item active" onclick="core.ui.switchTab('home')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</button>
    <button class="tab-item" onclick="core.ui.switchTab('discover')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>Discover</button>
    <button class="tab-item" onclick="core.ui.switchTab('search')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>Search</button>
    <button class="tab-item" onclick="core.ui.switchTab('library')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>Library</button>
    <button class="tab-item" onclick="core.ui.switchTab('modules')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 12c0-1.1-.9-2-2-2h-3c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2v-3zM10 12c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2v-3zM10 4c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2V4zm10 0c0-1.1-.9-2-2-2h-3c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2V4z"/></svg>Modules
    </button>
  </nav>

  <div id="player-overlay">
    <button onclick="core.ui.closePlayer()" style="background:none; border:none; color:#fff; padding:10px 0;"><svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg></button>
    <div id="main-player-content" style="margin-top:20px;">
        <img id="player-art" style="width:100%; aspect-ratio:1; border-radius:16px; background:#111;">
        <div style="margin-top:25px;">
            <div id="player-title" style="font-size:1.5rem; font-weight:800;">Not Playing</div>
            <div id="player-artist" style="opacity:0.6; font-size:1.1rem;">Ready for 8SPINE</div>
        </div>
        </div>
  </div>

  <input type="file" id="module-input" hidden accept=".8spine,.js">
  <input type="file" id="playlist-input" hidden multiple>

  <script>
    class LosslessCore {
      constructor() {
        this.modules = [];
        this.currentModule = null;
        this.audio = new Audio();
        this.ui = {
          switchTab: (id) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
          },
          openPlayer: () => document.getElementById('player-overlay').classList.add('active'),
          closePlayer: () => document.getElementById('player-overlay').classList.remove('active')
        };
        this.init();
      }

      init() {
        document.getElementById('module-input').onchange = (e) => this.loadModule(e.target.files[0]);
        document.getElementById('search-bar').oninput = (e) => this.handleSearch(e.target.value);
      }

      async loadModule(file) {
        const text = await file.text();
        const blob = new Blob([text], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        
        try {
          // 8SPINE modules usually define a global object or export functions
          const script = document.createElement('script');
          script.src = url;
          document.head.appendChild(script);
          
          this.modules.push({ name: file.name, content: text });
          this.renderModules();
        } catch (err) { alert("Failed to load module logic."); }
      }

      renderModules() {
        document.getElementById('module-list').innerHTML = this.modules.map(m => `
          <div class="module-item">
            <span>${m.name}</span>
            <span style="color:#1DB954; font-size:0.7rem;">ACTIVE</span>
          </div>
        `).join('');
      }

      async handleSearch(q) {
        if (q.length < 3) return;
        // If a module like Qobuz is loaded, we would call its search function here
        // For now, defaulting to iTunes metadata search
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=12`);
        const data = await res.json();
        
        document.getElementById('search-results').innerHTML = data.results.map(t => `
          <div class="card" onclick="core.playTrack('${t.trackName}', '${t.artistName}', '${t.artworkUrl100.replace('100x100','600x600')}')">
            <img src="${t.artworkUrl100.replace('100x100','300x300')}">
            <div class="track-name">${t.trackName}</div>
            <div class="track-sub">${t.artistName}</div>
          </div>
        `).join('');
      }

      playTrack(title, artist, art) {
        document.getElementById('mini-title').textContent = title;
        document.getElementById('mini-artist').textContent = artist;
        document.getElementById('mini-art').src = art;
        document.getElementById('player-title').textContent = title;
        document.getElementById('player-artist').textContent = artist;
        document.getElementById('player-art').src = art;
      }
    }

    const core = new LosslessCore();
  </script>
</body>
</html>
