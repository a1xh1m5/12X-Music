<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lossless Core | ALAC Engine</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@uimaxbai/am-lyrics/dist/src/am-lyrics.min.js"></script>

  <style>
    :root {
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 20px);
      --accent: #fe2c55;
      --font: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #000; color: #fff; font-family: var(--font); height: 100dvh; overflow: hidden; }

    /* Ambient Motion Background */
    #bg { position: fixed; inset: -100px; z-index: -1; }
    #bg-art { 
      width: 120%; height: 120%; object-fit: cover; 
      filter: blur(80px) brightness(0.25) saturate(1.4); 
      opacity: 0; transition: opacity 1.5s ease;
    }
    #bg-art.visible { opacity: 1; }

    /* Main Container */
    #player {
      display: flex; flex-direction: column; height: 100%;
      padding: calc(var(--safe-t) + 20px) 25px var(--safe-b);
      z-index: 10; position: relative;
    }

    /* Grid Layout: Handles both Desktop and iPhone */
    .content-grid {
      display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px;
      max-width: 1400px; width: 100%; margin: 0 auto; flex: 1; align-items: center;
    }

    /* MOBILE LYRICS OVERHAUL */
    @media (max-width: 1000px) {
      .content-grid { grid-template-columns: 1fr; }
      #lyrics-section { 
        position: fixed; inset: 0; background: rgba(0,0,0,0.98); 
        z-index: 1000; transform: translateY(100%); 
        transition: transform 0.5s cubic-bezier(0.32, 1, 0.23, 1);
        padding: calc(var(--safe-t) + 40px) 20px 40px;
        display: flex !important; flex-direction: column;
      }
      #lyrics-section.active { transform: translateY(0); }
    }

    /* Art Card */
    #art-card {
      width: 100%; aspect-ratio: 1/1; border-radius: 28px;
      background: #111; overflow: hidden;
      box-shadow: 0 40px 100px rgba(0,0,0,0.8);
    }
    #art { width: 100%; height: 100%; object-fit: cover; }

    /* Meta & Controls */
    #meta { margin-top: 30px; }
    #title { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
    #artist { font-size: 1.4rem; opacity: 0.5; font-weight: 400; margin: 5px 0 0; }
    #source-pill { font-family: 'DM Mono'; font-size: 0.7rem; background: var(--accent); padding: 4px 10px; border-radius: 6px; width: fit-content; margin-bottom: 15px; }

    #seekbar { height: 30px; display: flex; align-items: center; cursor: pointer; margin-top: 20px; }
    #seek-track { width: 100%; height: 5px; background: rgba(255,255,255,0.15); border-radius: 10px; position: relative; }
    #seek-fill { height: 100%; background: #fff; width: 0%; border-radius: 10px; }

    #controls { display: flex; justify-content: space-between; align-items: center; margin: 40px 0; }
    .play-btn { width: 85px; height: 85px; border-radius: 50%; background: #fff; color: #000; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .icon-btn { background: none; border: none; color: #fff; cursor: pointer; }
    .hidden { display: none; }

    /* Dock Bar */
    #bottom-dock { display: flex; justify-content: space-around; padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); }
    .dock-item { background: none; border: none; color: #fff; font-weight: 800; font-size: 0.9rem; cursor: pointer; opacity: 0.7; }
    .dock-item:hover { opacity: 1; }

    /* Lyrics Customization */
    am-lyrics { --am-lyrics-font-size: 2.5rem; height: 100%; }
    #close-lyrics { position: absolute; top: 20px; right: 20px; font-weight: 800; opacity: 0.6; display: none; padding: 10px; color: white; background: none; border: none; }
    @media (max-width: 1000px) { #close-lyrics { display: block; } }
  </style>
</head>
<body>

  <div id="bg"><img id="bg-art" src="" alt=""></div>

  <main id="player">
    <div class="content-grid">
      <section id="now-playing">
        <div id="source-pill">ALAC_BITPERFECT_192KHZ</div>
        
        <div id="art-section">
          <div id="art-card"><img id="art" src="" alt=""></div>
        </div>

        <div id="meta">
          <h1 id="title">System Ready</h1>
          <h2 id="artist">Import ALAC Files</h2>
        </div>

        <div id="seek-area">
          <div id="seekbar" onclick="core.seek(event)">
            <div id="seek-track"><div id="seek-fill"></div></div>
          </div>
          <div style="display:flex; justify-content:space-between; font-family:'DM Mono'; font-size:0.8rem; opacity:0.5; margin-top:10px;">
            <span id="t-cur">0:00</span>
            <span id="t-tot">0:00</span>
          </div>
        </div>

        <div id="controls">
          <button class="icon-btn" onclick="core.prev()"><svg width="35" height="35" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button class="play-btn" id="playBtn">
            <svg id="icon-play" width="45" height="45" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" class="hidden" width="45" height="45" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button class="icon-btn" onclick="core.next()"><svg width="35" height="35" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        </div>
      </section>

      <section id="lyrics-section">
        <button id="close-lyrics" onclick="document.getElementById('lyrics-section').classList.remove('active')">CLOSE</button>
        <am-lyrics id="amLyrics" current-time="0" highlight-color="#ffffff"></am-lyrics>
      </section>
    </div>

    <footer id="bottom-dock">
      <button class="dock-item" onclick="document.getElementById('fileInput').click()">IMPORT</button>
      <button class="dock-item" onclick="document.getElementById('lyrics-section').classList.add('active')">LYRICS</button>
      <button class="dock-item" onclick="location.reload()">RESET</button>
    </footer>
  </main>

  <input type="file" id="fileInput" hidden multiple accept="audio/*,.m4a">

  <script>
    class LosslessCore {
      constructor() {
        this.audio = new Audio();
        this.queue = [];
        this.idx = 0;
        this.playing = false;
        this.setup();
      }

      setup() {
        const $ = i => document.getElementById(i);
        this.els = {
          title: $('title'), artist: $('artist'), art: $('art'), bg: $('bg-art'),
          fill: $('seek-fill'), cur: $('t-cur'), tot: $('t-tot'),
          lyr: $('amLyrics'), playIcon: $('icon-play'), pauseIcon: $('icon-pause')
        };

        $('playBtn').onclick = () => this.toggle();
        $('fileInput').onchange = (e) => this.handleImport(e.target.files);

        this.audio.ontimeupdate = () => {
          const t = this.audio.currentTime;
          const d = this.audio.duration;
          if (!isNaN(d)) {
            this.els.fill.style.width = `${(t/d)*100}%`;
            this.els.cur.textContent = this.fmt(t);
            this.els.tot.textContent = this.fmt(d);
            this.els.lyr.setAttribute('current-time', t);
          }
        };

        this.audio.onended = () => this.next();
      }

      handleImport(files) {
        this.queue = Array.from(files).map(f => ({
          url: URL.createObjectURL(f),
          name: f.name.replace(/\.[^.]+$/, ''),
          isALAC: f.name.toLowerCase().endsWith('.m4a')
        }));
        if (this.queue.length > 0) this.play(0);
      }

      play(index) {
        this.idx = index;
        const track = this.queue[index];
        this.audio.src = track.url;
        if (track.isALAC) this.audio.type = 'audio/mp4';

        this.audio.play().then(() => {
          this.playing = true;
          this.updateUI(track.name);
          this.fetchMetadata(track.name);
        }).catch(() => {
          this.playing = false;
          this.updateUI(track.name);
        });
      }

      async fetchMetadata(fileName) {
        // PARSE FILENAME FOR BETTER ACCURACY
        let query = fileName;
        let artistHint = "";

        if (fileName.includes(" - ")) {
          const parts = fileName.split(" - ");
          artistHint = parts[0];
          query = `${parts[1]} ${parts[0]}`; 
        }

        try {
          // Search iTunes API with Artist + Title combined
          const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=5`);
          const data = await res.json();
          
          // Double-check: filter results to find the actual artist match
          let bestMatch = data.results[0];
          if (artistHint) {
             const match = data.results.find(r => 
                r.artistName.toLowerCase().includes(artistHint.toLowerCase()) || 
                artistHint.toLowerCase().includes(r.artistName.toLowerCase())
             );
             if (match) bestMatch = match;
          }

          if (bestMatch) {
            const highResArt = bestMatch.artworkUrl100.replace('100x100bb', '1200x1200bb');
            this.els.title.textContent = bestMatch.trackName;
            this.els.artist.textContent = bestMatch.artistName;
            this.els.art.src = highResArt;
            this.els.bg.src = highResArt;
            this.els.bg.classList.add('visible');
            
            // Sync with am-lyrics component
            this.els.lyr.setAttribute('song-title', bestMatch.trackName);
            this.els.lyr.setAttribute('song-artist', bestMatch.artistName);
          }
        } catch (e) {
          console.warn("Meta Fetch Failed", e);
          this.els.title.textContent = fileName;
          this.els.artist.textContent = "Local Lossless File";
        }
      }

      toggle() {
        this.audio.paused ? this.audio.play() : this.audio.pause();
        this.playing = !this.audio.paused;
        this.updateUI();
      }

      seek(e) {
        const rect = document.getElementById('seek-track').getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        this.audio.currentTime = pos * this.audio.duration;
      }

      updateUI(t) {
        if (t) this.els.title.textContent = t;
        this.els.playIcon.classList.toggle('hidden', this.playing);
        this.els.pauseIcon.classList.toggle('hidden', !this.playing);
      }

      fmt(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
      }

      next() { if (this.idx < this.queue.length - 1) this.play(this.idx + 1); }
      prev() { if (this.idx > 0) this.play(this.idx - 1); }
    }

    const core = new LosslessCore();
  </script>
</body>
</html>
