<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lossless Core</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
</head>
<body>
  <div id="scrim"></div>
  <div id="bg"><img id="bg-art" src="" alt=""></div>

  <main id="player">
    <header id="top-nav">
      <div id="module-indicator">LOCAL_CORE</div>
      <button id="menuBtn" class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </header>

    <section id="now-playing">
      <div id="art-container">
        <div id="art-card">
          <img id="main-art" src="" alt="Album Art">
        </div>
      </div>

      <div id="track-info">
        <div class="text-wrap">
          <h1 id="track-title">Not Playing</h1>
          <h2 id="track-artist">Select a Module or File</h2>
        </div>
        <button id="favBtn" class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>

      <div id="progress-container">
        <div id="time-row">
          <span id="cur-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
        <div id="progress-bar">
          <div id="progress-fill"></div>
          <div id="progress-knob"></div>
        </div>
      </div>

      <div id="transport-controls">
        <button id="shuffleBtn" class="sub-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        
        <div class="main-keys">
          <button id="prevBtn" class="key-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button id="playBtn" class="play-key">
            <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button id="nextBtn" class="key-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <button id="repeatBtn" class="sub-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
    </section>

    <footer id="bottom-dock">
      <button class="dock-item" onclick="document.getElementById('fileInput').click()">
        <span>Upload</span>
      </button>
      <button class="dock-item active">
        <span>Now Playing</span>
      </button>
      <button class="dock-item" id="lyricsToggle">
        <span>Lyrics</span>
      </button>
    </footer>
  </main>

  <input type="file" id="fileInput" hidden multiple accept="audio/*">
  <script src="app.js"></script>
</body>
</html>
