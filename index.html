<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lossless Core">
  <link rel="manifest" href="manifest.json">
  <title>Lossless Core</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- ID3 tag reader for local files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <!-- am-lyrics (binimum/apple-music-web-components) -->
  <script type="module">
    import 'https://cdn.jsdelivr.net/npm/@uimaxbai/am-lyrics/dist/src/am-lyrics.min.js';
  </script>
</head>
<body>

<!-- Dynamic blurred background -->
<div id="bg"><img id="bg-art" src="" alt="" aria-hidden="true"></div>

<!-- Drop hint -->
<div id="drop-overlay" aria-hidden="true"><span>Drop audio files</span></div>

<!-- ── PLAYER ─────────────────────────────────────── -->
<main id="player">

  <div id="topbar">
    <button class="icon-btn" id="queueBtn" aria-label="Queue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="13" y2="18"/></svg>
    </button>
    <div id="source-pill"></div>
    <button class="icon-btn" id="moduleBtn" aria-label="Load module">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </button>
  </div>

  <!-- Art -->
  <div id="art-section">
    <div id="art-card">
      <img id="art" src="" alt="Album art">
      <div id="art-empty">
        <svg viewBox="0 0 80 80" fill="none">
          <circle cx="40" cy="40" r="36" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
          <circle cx="40" cy="40" r="14" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
          <circle cx="40" cy="40" r="3" fill="rgba(255,255,255,0.15)"/>
        </svg>
        <p>Open files or load a module</p>
      </div>
    </div>
  </div>

  <!-- Meta -->
  <div id="meta">
    <div id="title-row">
      <div id="title">Lossless Core</div>
      <button class="icon-btn fav-btn" id="favBtn" aria-label="Favourite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
    </div>
    <div id="artist">No track loaded</div>
    <div id="quality-label"></div>
  </div>

  <!-- Seekbar -->
  <div id="seek-area">
    <div id="seekbar" role="slider" aria-label="Playback position" tabindex="0">
      <div id="seek-track">
        <div id="seek-fill"></div>
        <div id="seek-thumb"></div>
      </div>
    </div>
    <div id="time-row">
      <span id="t-cur">0:00</span>
      <span id="t-tot">0:00</span>
    </div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button class="icon-btn ctrl-side" id="shuffleBtn" aria-label="Shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    </button>
    <button class="icon-btn ctrl-main" id="prevBtn" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="play-btn" id="playBtn" aria-label="Play/Pause">
      <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" class="hidden"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
    <button class="icon-btn ctrl-main" id="nextBtn" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
    <button class="icon-btn ctrl-side" id="repeatBtn" aria-label="Repeat">
      <svg id="iconRepeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      <svg id="iconRepeatOne" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="hidden"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><path d="M11 17V10l-2 2" stroke-width="1.4"/></svg>
    </button>
  </div>

  <!-- Volume -->
  <div id="vol-row">
    <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
    <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77 0-4.28-2.99-7.86-7-8.77z"/></svg>
  </div>

  <!-- Bottom -->
  <div id="actions">
    <button class="action-btn" id="openBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Open Files
    </button>
    <button class="action-btn" id="lyricsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Lyrics
    </button>
  </div>

</main>

<!-- ── QUEUE DRAWER ─────────────────────────────────── -->
<div id="queue-drawer" class="drawer" aria-hidden="true">
  <div class="drawer-pill"></div>
  <div id="queue-head">
    <span>Up Next</span>
    <button class="icon-btn" id="closeQueueBtn" aria-label="Close queue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div id="queue-list" role="list"></div>
</div>

<!-- ── LYRICS SHEET ─────────────────────────────────── -->
<div id="lyrics-sheet" class="sheet" aria-hidden="true">
  <div id="lyrics-handle" class="drawer-pill"></div>
  <div id="lyrics-header">
    <div id="lyr-mini">
      <img id="lyr-art" src="" alt="">
      <div>
        <div id="lyr-title"></div>
        <div id="lyr-artist"></div>
      </div>
    </div>
    <button class="icon-btn" id="closeLyricsBtn" aria-label="Close lyrics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>

  <am-lyrics
    id="amLyrics"
    current-time="0"
    highlight-color="#ffffff"
    hover-background-color="rgba(255,255,255,0.07)"
    font-family="'Plus Jakarta Sans', sans-serif"
    autoscroll
    interpolate
  ></am-lyrics>

  <div id="lyrics-plain"></div>
</div>

<!-- Scrim -->
<div id="scrim"></div>
<!-- Toast -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- File inputs (hidden) -->
<input type="file" id="fileInput" multiple accept="audio/*,.flac,.wav,.aiff,.aif,.dsf" style="display:none">
<input type="file" id="modInput" accept=".js" style="display:none">

<script type="module" src="app.js"></script>
</body>
</html>
