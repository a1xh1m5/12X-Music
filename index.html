<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Core | Lossless</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@uimaxbai/am-lyrics/dist/src/am-lyrics.min.js"></script>

  <style>
    :root {
      --bg: #050505;
      --card: #121212;
      --accent: #1DB954; /* Spotify Green */
      --text-dim: rgba(255,255,255,0.6);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      margin: 0; background: var(--bg); color: #fff; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      height: 100dvh; overflow: hidden;
    }

    /* Ambient Background */
    #ambient-bg {
      position: fixed; inset: -50px; z-index: -1;
      background: radial-gradient(circle at top left, #222, #050505);
      transition: background 1s ease;
    }

    /* Tab Content Area */
    .tab-content {
      height: calc(100dvh - 80px - var(--safe-b));
      overflow-y: auto; padding: calc(var(--safe-t) + 20px) 20px 120px;
      display: none;
    }
    .tab-content.active { display: block; }

    /* Player View (Overlay) */
    #player-view {
      position: fixed; inset: 0; background: #000; z-index: 2000;
      transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 1, 0.23, 1);
      display: flex; flex-direction: column; padding: calc(var(--safe-t) + 20px) 30px;
    }
    #player-view.open { transform: translateY(0); }

    /* UI Elements */
    .section-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; }
    
    /* Small UI Mini Player */
    #mini-player {
      position: fixed; bottom: calc(85px + var(--safe-b)); left: 10px; right: 10px;
      height: 64px; background: #1a1a1a; border-radius: 12px;
      display: flex; align-items: center; padding: 0 12px; z-index: 1000;
      border: 1px solid rgba(255,255,255,0.05);
    }
    #mini-art { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; }
    #mini-meta { flex: 1; margin-left: 12px; overflow: hidden; }
    #mini-title { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Bottom Tab Bar */
    #tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(80px + var(--safe-b)); background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; justify-content: space-around; align-items: center;
      padding-bottom: var(--safe-b); z-index: 1500;
    }
    .tab-item { 
      display: flex; flex-direction: column; align-items: center; 
      color: var(--text-dim); border: none; background: none; font-size: 0.65rem; font-weight: 600;
    }
    .tab-item.active { color: #fff; }
    .tab-item svg { margin-bottom: 4px; width: 24px; height: 24px; }

    /* Search Bar */
    #search-input {
      width: 100%; background: #222; border: none; border-radius: 8px;
      padding: 12px 16px; color: #fff; font-family: inherit; font-size: 1rem;
      margin-bottom: 20px;
    }

    /* Grid Items */
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .card { background: #181818; padding: 15px; border-radius: 12px; text-align: left; }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 8px; margin-bottom: 10px; }

    /* Full Player Components */
    #main-art { width: 100%; aspect-ratio: 1; border-radius: 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
    #main-meta { margin-top: 30px; }
    #main-title { font-size: 1.8rem; font-weight: 800; }
    #main-artist { color: var(--text-dim); font-size: 1.2rem; }

    am-lyrics { height: 100%; --am-lyrics-font-size: 2rem; }
  </style>
</head>
<body>

  <div id="ambient-bg"></div>

  <div id="home" class="tab-content active">
    <h1 class="section-title">Recently Listened</h1>
    <div class="grid-container" id="recent-grid">
      </div>
  </div>

  <div id="discover" class="tab-content">
    <h1 class="section-title">Hottest Near You</h1>
    <div class="grid-container" id="discover-grid"></div>
  </div>

  <div id="search" class="tab-content">
    <input type="text" id="search-input" placeholder="Search Artists or ALAC Files...">
    <div id="search-results"></div>
  </div>

  <div id="library" class="tab-content">
    <h1 class="section-title">Your Library</h1>
    <button class="card" style="width: 100%;" onclick="document.getElementById('fileInput').click()">+ Import ALAC Folder</button>
    <div id="playlist-container"></div>
  </div>

  <div id="mini-player" onclick="core.openPlayer()">
    <img id="mini-art" src="https://via.placeholder.com/150/111/fff?text=Core" alt="">
    <div id="mini-meta">
      <div id="mini-title">Not Playing</div>
      <div id="mini-artist" style="font-size: 0.75rem; opacity: 0.6;">Tap to open</div>
    </div>
    <button class="play-btn" id="miniPlayBtn" style="background:none; border:none; color:white;">
        <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <nav id="tab-bar">
    <button class="tab-item active" onclick="core.switchTab('home')">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home
    </button>
    <button class="tab-item" onclick="core.switchTab('discover')">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>Discover
    </button>
    <button class="tab-item" onclick="core.switchTab('search')">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>Search
    </button>
    <button class="tab-item" onclick="core.switchTab('library')">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>Library
    </button>
  </nav>

  <div id="player-view">
    <button onclick="core.closePlayer()" style="background:none; border:none; color:white; padding: 20px 0; text-align: left;">
        <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
    </button>
    <div id="player-content" style="display:grid; grid-template-columns: 1fr; gap: 40px; flex: 1;">
        <div id="main-ui">
            <img id="main-art" src="" alt="">
            <div id="main-meta">
                <div id="main-title">Not Playing</div>
                <div id="main-artist">Ready to Stream</div>
            </div>
            </div>
        <div id="lyrics-ui" style="display:none; height: 100%;">
            <am-lyrics id="amLyrics"></am-lyrics>
        </div>
    </div>
    <div id="player-bottom-toggle" style="display:flex; justify-content:center; padding: 20px;">
        <button onclick="core.toggleLyrics()" style="background:rgba(255,255,255,0.1); border:none; color:white; border-radius:20px; padding: 8px 20px; font-weight:700;">LYRICS</button>
    </div>
  </div>

  <input type="file" id="fileInput" hidden multiple webkitdirectory>

  <script>
    class LosslessCore {
      constructor() {
        this.audio = new Audio();
        this.queue = [];
        this.setup();
      }

      setup() {
        document.getElementById('search-input').oninput = (e) => this.search(e.target.value);
        this.fetchDiscover();
      }

      switchTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        // Find the button and add active class (simplified logic)
        event.currentTarget.classList.add('active');
      }

      openPlayer() { document.getElementById('player-view').classList.add('open'); }
      closePlayer() { document.getElementById('player-view').classList.remove('open'); }

      async search(q) {
        if (q.length < 3) return;
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=10`);
        const data = await res.json();
        const results = document.getElementById('search-results');
        results.innerHTML = data.results.map(t => `
          <div class="card" style="display:flex; align-items:center; margin-bottom:10px;">
            <img src="${t.artworkUrl60}" style="width:50px; margin:0 15px 0 0;">
            <div>
              <div style="font-weight:700;">${t.trackName}</div>
              <div style="font-size:0.8rem; opacity:0.6;">${t.artistName}</div>
            </div>
          </div>
        `).join('');
      }

      async fetchDiscover() {
        // Logic to fetch "Hottest" hits based on your region (MS, USA)
        const res = await fetch(`https://itunes.apple.com/search?term=pop&entity=song&limit=4`);
        const data = await res.json();
        document.getElementById('discover-grid').innerHTML = data.results.map(t => `
          <div class="card">
            <img src="${t.artworkUrl100.replace('100x100', '600x600')}">
            <div style="font-weight:700;">${t.trackName}</div>
            <div style="font-size:0.8rem; opacity:0.6;">${t.artistName}</div>
          </div>
        `).join('');
      }

      toggleLyrics() {
          const l = document.getElementById('lyrics-ui');
          const m = document.getElementById('main-ui');
          l.style.display = l.style.display === 'none' ? 'block' : 'none';
          m.style.display = m.style.display === 'none' ? 'block' : 'none';
      }
    }

    const core = new LosslessCore();
  </script>
</body>
</html>
