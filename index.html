<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lossless Core | Pure</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

  <style>
    :root {
      --accent: #fff;
      --bg-top: #1a1a1a;
      --bg-bottom: #000;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    body { 
      margin: 0; background: #000; color: #fff; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      height: 100dvh; overflow: hidden;
      transition: background 1.5s ease;
    }

    /* ── IMMERSIVE BACKGROUND ── */
    #dynamic-bg {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      z-index: -1; transition: 1.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.8;
    }

    .tab-content {
      height: 100dvh; overflow-y: auto; 
      padding: calc(var(--safe-t) + 20px) 20px 220px; 
      display: none;
    }
    .tab-content.active { display: block; animation: fadeIn 0.4s ease-out; }

    /* ── UI ELEMENTS ── */
    .section-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 24px; letter-spacing: -0.05em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; }
    
    .card { 
      background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
      border-radius: 18px; padding: 12px; border: 1px solid rgba(255,255,255,0.1);
    }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; }

    /* ── PLAYER SCREEN (FULL) ── */
    #full-player {
      position: fixed; inset: 0; 
      background: rgba(0,0,0,0.85); backdrop-filter: blur(40px);
      z-index: 3000; transform: translateY(100%); 
      transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
      display: flex; flex-direction: column;
      padding: calc(var(--safe-t) + 20px) 30px var(--safe-b);
    }
    #full-player.active { transform: translateY(0); }

    .now-playing-container {
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    }

    #big-art { 
      width: 100%; max-width: 340px; aspect-ratio: 1; 
      border-radius: 20px; object-fit: cover;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6);
      transition: transform 0.3s ease;
    }
    #big-art.playing { transform: scale(1.05); }

    .track-info { width: 100%; margin-top: 40px; display: flex; align-items: center; justify-content: space-between; }
    .track-text { flex: 1; }
    #big-title { font-size: 1.7rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #big-artist { font-size: 1.2rem; opacity: 0.6; margin-top: 4px; }

    /* ── CONTROLS ── */
    .controls-wrapper { width: 100%; margin-top: 30px; }
    .progress-area { margin-bottom: 40px; }
    .time-labels { display: flex; justify-content: space-between; font-size: 0.75rem; opacity: 0.5; margin-top: 8px; }
    
    .slider {
      -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,0.1);
      border-radius: 2px; outline: none;
    }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; cursor: pointer; }

    .main-controls { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
    .btn-icon { background: none; border: none; color: #fff; padding: 10px; cursor: pointer; }
    .play-btn { 
      width: 72px; height: 72px; background: #fff; color: #000; 
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }

    /* ── FOOTER UI ── */
    .player-footer {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: auto; padding-bottom: 20px; opacity: 0.7;
    }

    /* ── NAVIGATION ── */
    #nav {
      position: fixed; bottom: 0; width: 100%; height: calc(80px + var(--safe-b));
      background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
      display: flex; justify-content: space-around; align-items: center;
      padding-bottom: var(--safe-b); border-top: 1px solid rgba(255,255,255,0.05);
    }
    .nav-item { color: #555; text-align: center; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
    .nav-item.active { color: #fff; }
  </style>
</head>
<body>

  <div id="dynamic-bg"></div>

  <div id="home" class="tab-content active">
    <div class="section-title">Library</div>
    <div class="grid" id="library-grid">
        <div class="card" onclick="$('file-input').click()">
            <div style="height:140px; display:flex; align-items:center; justify-content:center; font-size:2rem;">+</div>
            <div style="text-align:center; font-weight:600;">Import Audio</div>
        </div>
    </div>
  </div>

  <div id="full-player">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <button class="btn-icon" onclick="app.ui.close()">
            <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
        </button>
        <span style="font-size:0.7rem; font-weight:800; letter-spacing:0.1em; opacity:0.5;">ALAC_BITPERFECT_READY</span>
        <button class="btn-icon"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    </div>

    <div class="now-playing-container">
        <img id="big-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1000&auto=format&fit=crop" crossorigin="anonymous">
        
        <div class="track-info">
            <div class="track-text">
                <div id="big-title">No Track Loaded</div>
                <div id="big-artist">Tap + to start</div>
            </div>
            <button class="btn-icon" style="color:rgba(255,255,255,0.3)">
                <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.175 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
            </button>
        </div>

        <div class="controls-wrapper">
            <div class="progress-area">
                <input type="range" class="slider" id="progress" value="0">
                <div class="time-labels">
                    <span id="cur-time">0:00</span>
                    <span id="dur-time">0:00</span>
                </div>
            </div>

            <div class="main-controls">
                <button class="btn-icon"><svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M7 6v12l10-6z" transform="rotate(180 12 12)"/></svg></button>
                <div class="play-btn" onclick="app.toggle()">
                    <svg id="play-icon" width="36" height="36" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <button class="btn-icon"><svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M7 6v12l10-6z"/></svg></button>
            </div>
        </div>
    </div>

    <div class="player-footer">
        <button class="btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 8h10M7 12h10M7 16h10"/></svg></button>
        <button class="btn-icon" onclick="app.ui.open()"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19V6l12-3v13M9 10l12-3"/></svg></button>
    </div>
  </div>

  <nav id="nav">
    <div class="nav-item active">Home</div>
    <div class="nav-item">Search</div>
    <div class="nav-item" onclick="app.ui.open()">Player</div>
  </nav>

  <input type="file" id="file-input" hidden accept="audio/*">

  <script>
    const $ = id => document.getElementById(id);
    const colorThief = new ColorThief();

    class LosslessCore {
      constructor() {
        this.audio = new Audio();
        this.isPlaying = false;
        
        this.ui = {
          open: () => $('full-player').classList.add('active'),
          close: () => $('full-player').classList.remove('active')
        };

        this.init();
      }

      init() {
        $('file-input').onchange = (e) => this.handleFile(e.target.files[0]);
        
        this.audio.ontimeupdate = () => {
          const p = (this.audio.currentTime / this.audio.duration) * 100;
          $('progress').value = p || 0;
          $('cur-time').textContent = this.formatTime(this.audio.currentTime);
          $('dur-time').textContent = this.formatTime(this.audio.duration);
        };

        $('progress').oninput = (e) => {
          this.audio.currentTime = (e.target.value / 100) * this.audio.duration;
        };

        // Extraction Logic
        $('big-art').onload = () => this.updateColors();
      }

      handleFile(file) {
        if(!file) return;
        const url = URL.createObjectURL(file);
        this.audio.src = url;
        $('big-title').textContent = file.name.split('.')[0];
        $('big-artist').textContent = "Local File";
        this.toggle();
        this.ui.open();
      }

      toggle() {
        if(this.audio.paused) {
          this.audio.play();
          $('play-icon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          $('big-art').classList.add('playing');
        } else {
          this.audio.pause();
          $('play-icon').innerHTML = '<path d="M8 5v14l11-7z"/>';
          $('big-art').classList.remove('playing');
        }
      }

      updateColors() {
        try {
          const colors = colorThief.getPalette($('big-art'), 2);
          const c1 = `rgb(${colors[0].join(',')})`;
          const c2 = `rgb(${colors[1].join(',')})`;
          
          document.documentElement.style.setProperty('--bg-top', c1);
          document.documentElement.style.setProperty('--bg-bottom', '#000');
          $('dynamic-bg').style.background = `linear-gradient(180deg, ${c1} 0%, #000 100%)`;
        } catch(e) { console.log("Color extraction failed"); }
      }

      formatTime(secs) {
        if (isNaN(secs)) return "0:00";
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      }
    }

    const app = new LosslessCore();
  </script>
</body>
</html>
