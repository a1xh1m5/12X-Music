<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lossless Core</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

  <style>
    :root {
      --accent: #fff;
      --bg-dynamic: #121212;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body { 
      margin: 0; background: #000; color: #fff; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      height: 100dvh; overflow: hidden;
    }

    /* ── DYNAMIC BACKGROUND LAYER ── */
    #canvas-bg {
      position: fixed; inset: 0;
      background: radial-gradient(circle at top left, var(--bg-dynamic) 0%, #000 100%);
      z-index: -1; transition: background 2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── NAVIGATION BLOCKS ── */
    .tab-content {
      height: 100dvh; width: 100%;
      padding: calc(var(--safe-t) + 20px) 20px 180px; 
      display: none; position: absolute; top: 0; left: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }

    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

    .section-title { font-size: 2rem; font-weight: 800; margin-bottom: 25px; letter-spacing: -0.05em; }

    /* ── LIBRARY GRID ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .card { 
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 12px; transition: 0.2s;
    }
    .card:active { transform: scale(0.96); background: rgba(255,255,255,0.08); }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 14px; object-fit: cover; margin-bottom: 10px; }
    .t-name { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-sub { font-size: 0.8rem; opacity: 0.5; margin-top: 2px; }

    /* ── FIXED BOTTOM PLAYER (MINI) ── */
    #mini-player {
      position: fixed; bottom: calc(90px + var(--safe-b)); left: 15px; right: 15px;
      height: 64px; background: rgba(25, 25, 25, 0.85); backdrop-filter: blur(30px);
      border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; padding: 0 12px; z-index: 1000;
    }

    /* ── FULL SCREEN PLAYER ── */
    #full-player {
      position: fixed; inset: 0; background: #000; z-index: 2000;
      transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      display: flex; flex-direction: column; padding: calc(var(--safe-t) + 20px) 30px var(--safe-b);
    }
    #full-player.active { transform: translateY(0); }

    .art-container { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; }
    #big-art { 
      width: 100%; max-width: 350px; aspect-ratio: 1; border-radius: 24px; 
      box-shadow: 0 30px 60px rgba(0,0,0,0.7); object-fit: cover;
      transition: transform 0.4s ease;
    }
    .playing #big-art { transform: scale(1.04); }

    /* ── CONTROLS ── */
    .progress-wrap { margin: 30px 0; }
    .slider {
      -webkit-appearance: none; width: 100%; height: 5px; background: rgba(255,255,255,0.15);
      border-radius: 10px; outline: none;
    }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #fff; border-radius: 50%; }

    .controls-row { display: flex; justify-content: space-around; align-items: center; width: 100%; margin-bottom: 40px; }
    .play-trigger { 
      width: 80px; height: 80px; background: #fff; color: #000; border-radius: 50%; 
      display: flex; align-items: center; justify-content: center;
    }

    /* ── NAV BAR ── */
    #nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(80px + var(--safe-b)); background: rgba(0,0,0,0.9);
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex; justify-content: space-around; align-items: center;
      padding-bottom: var(--safe-b); z-index: 1500;
    }
    .nav-btn { background: none; border: none; color: #555; font-size: 0.7rem; font-weight: 800; cursor: pointer; }
    .nav-btn.active { color: #fff; }
  </style>
</head>
<body>

  <div id="canvas-bg"></div>

  <div id="view-home" class="tab-content active">
    <div class="section-title">Recently Played</div>
    <div id="recent-list" class="grid"></div>
  </div>

  <div id="view-search" class="tab-content">
    <div class="section-title">Search</div>
    <input type="text" placeholder="Artists, songs..." style="width:100%; padding:15px; border-radius:12px; border:none; background:rgba(255,255,255,0.05); color:#fff; font-size:1rem;">
    <p style="opacity:0.3; margin-top:20px;">Search functionality ready for local index.</p>
  </div>

  <div id="view-library" class="tab-content">
    <div class="section-title">Your Collection</div>
    <div class="grid">
        <div class="card" onclick="$('file-input').click()">
            <div style="height:140px; display:flex; align-items:center; justify-content:center; font-size:2rem; opacity:0.2;">+</div>
            <div class="t-name">Add Music</div>
            <div class="t-sub">Import ALAC/FLAC</div>
        </div>
    </div>
  </div>

  <div id="mini-player" onclick="app.ui.openFull()">
    <img id="mini-art" src="" style="width:40px; height:40px; border-radius:6px; background:#222; object-fit:cover;">
    <div style="flex:1; margin:0 12px; overflow:hidden;">
      <div id="mini-title" class="t-name">No Track</div>
      <div id="mini-artist" class="t-sub">Select a file</div>
    </div>
    <button onclick="event.stopPropagation(); app.toggle();" style="background:none; border:none; color:#fff;">
      <svg id="mini-play-svg" width="30" height="30" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <div id="full-player">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button onclick="app.ui.closeFull()" style="background:none; border:none; color:#fff;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7"/></svg></button>
      <div style="font-size:0.65rem; font-weight:800; letter-spacing:0.1em; opacity:0.4;">BIT-PERFECT OUTPUT</div>
      <button style="background:none; border:none; color:#fff;"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    </div>

    <div class="art-container">
      <img id="big-art" src="" crossorigin="anonymous">
    </div>

    <div style="width:100%;">
      <div id="big-title" style="font-size:1.8rem; font-weight:800; margin-bottom:5px;">Untitled</div>
      <div id="big-artist" style="font-size:1.2rem; opacity:0.5;">Unknown Artist</div>

      <div class="progress-wrap">
        <input type="range" id="scrubber" class="slider" value="0">
        <div style="display:flex; justify-content:space-between; font-size:0.75rem; opacity:0.4; margin-top:8px;">
          <span id="cur-time">0:00</span>
          <span id="dur-time">0:00</span>
        </div>
      </div>

      <div class="controls-row">
        <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        <div class="play-trigger" onclick="app.toggle()">
          <svg id="big-play-svg" width="40" height="40" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z"/></svg>
      </div>
    </div>
  </div>

  <nav id="nav-bar">
    <button class="nav-btn active" onclick="app.ui.switch('home')">Home</button>
    <button class="nav-btn" onclick="app.ui.switch('search')">Search</button>
    <button class="nav-btn" onclick="app.ui.switch('library')">Library</button>
  </nav>

  <input type="file" id="file-input" hidden accept="audio/*">

  <script>
    const $ = id => document.getElementById(id);
    const thief = new ColorThief();

    class LosslessCore {
      constructor() {
        this.audio = new Audio();
        this.currentView = 'home';
        this.ui = {
          switch: (id) => {
            document.querySelectorAll('.tab-content').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            $(`view-${id}`).classList.add('active');
            event.currentTarget.classList.add('active');
            this.currentView = id;
          },
          openFull: () => $('full-player').classList.add('active'),
          closeFull: () => $('full-player').classList.remove('active')
        };
        this.init();
      }

      init() {
        $('file-input').onchange = e => this.loadLocal(e.target.files[0]);
        
        this.audio.ontimeupdate = () => {
          const p = (this.audio.currentTime / this.audio.duration) * 100 || 0;
          $('scrubber').value = p;
          $('cur-time').textContent = this.fmt(this.audio.currentTime);
          $('dur-time').textContent = this.fmt(this.audio.duration);
        };

        $('scrubber').oninput = e => {
          this.audio.currentTime = (e.target.value / 100) * this.audio.duration;
        };

        $('big-art').onload = () => this.updateColors();
      }

      loadLocal(file) {
        if (!file) return;
        const url = URL.createObjectURL(file);
        this.audio.src = url;
        const name = file.name.split('.')[0];
        
        $('big-title').textContent = name;
        $('mini-title').textContent = name;
        $('big-artist').textContent = "Local Import";
        
        // Placeholder for art if no tags found
        $('big-art').src = "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=800";
        $('mini-art').src = "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=800";
        
        this.toggle();
        this.ui.openFull();
      }

      toggle() {
        const icons = { play: '<path d="M8 5v14l11-7z"/>', pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' };
        if (this.audio.paused) {
          this.audio.play();
          $('big-play-svg').innerHTML = icons.pause;
          $('mini-play-svg').innerHTML = icons.pause;
          document.body.classList.add('playing');
        } else {
          this.audio.pause();
          $('big-play-svg').innerHTML = icons.play;
          $('mini-play-svg').innerHTML = icons.play;
          document.body.classList.remove('playing');
        }
      }

      updateColors() {
        try {
          const palette = thief.getPalette($('big-art'), 3);
          const dominant = `rgb(${palette[0].join(',')})`;
          document.documentElement.style.setProperty('--bg-dynamic', dominant);
        } catch(e) {}
      }

      fmt(s) {
        if (isNaN(s)) return "0:00";
        const min = Math.floor(s/60), sec = Math.floor(s%60);
        return `${min}:${sec < 10 ? '0' : ''}${sec}`;
      }
    }

    const app = new LosslessCore();
  </script>
</body>
</html>
