<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lossless Core | 8SPINE</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@uimaxbai/am-lyrics/dist/src/am-lyrics.min.js"></script>

  <style>
    :root {
      --bg: #000;
      --card: #121212;
      --accent: #fff;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { 
      margin: 0; background: var(--bg); color: #fff; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      height: 100dvh; overflow: hidden;
    }

    /* Content Layout */
    .tab-content {
      height: 100dvh; overflow-y: auto; 
      padding: calc(var(--safe-t) + 20px) 20px 180px; 
      display: none;
    }
    .tab-content.active { display: block; }
    
    .section-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.03em; }

    /* Modern Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    .card { background: var(--card); border-radius: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; margin-bottom: 10px; background: #1a1a1a; }
    .t-name { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-sub { font-size: 0.75rem; opacity: 0.5; margin-top: 2px; }

    /* Bottom Tab Bar (5 Buttons) */
    #tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(75px + var(--safe-b)); background: rgba(0,0,0,0.95);
      backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-around; align-items: center;
      padding-bottom: var(--safe-b); z-index: 1000;
    }
    .tab-btn { 
      background: none; border: none; color: #666; 
      display: flex; flex-direction: column; align-items: center; 
      font-size: 0.6rem; font-weight: 700; gap: 4px; 
    }
    .tab-btn.active { color: #fff; }
    .tab-btn svg { width: 22px; height: 22px; }

    /* Floating Mini Player */
    #mini-player {
      position: fixed; bottom: calc(85px + var(--safe-b)); left: 10px; right: 10px;
      height: 56px; background: #1a1a1a; border-radius: 10px;
      display: flex; align-items: center; padding: 0 12px; z-index: 900;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #m-art { width: 40px; height: 40px; border-radius: 5px; background: #222; }

    /* Search & Inputs */
    #search-bar { 
      width: 100%; background: #161616; border: 1px solid #222; border-radius: 10px; 
      padding: 14px; color: #fff; font-family: inherit; font-size: 1rem; margin-bottom: 20px;
    }
    
    /* Module View */
    .mod-item { 
      background: #111; padding: 15px; border-radius: 12px; margin-bottom: 10px;
      display: flex; align-items: center; border: 1px solid #222;
    }
    .mod-status { font-size: 0.6rem; font-weight: 800; background: #fff; color: #000; padding: 2px 6px; border-radius: 4px; margin-left: auto; }
  </style>
</head>
<body>

  <div id="home" class="tab-content active"><h2 class="section-title">Recently Played</h2><div id="home-grid" class="grid"></div></div>
  <div id="discover" class="tab-content"><h2 class="section-title">Hottest Hits</h2><div id="discover-grid" class="grid"></div></div>
  
  <div id="search" class="tab-content">
    <input type="text" id="search-bar" placeholder="Search for songs...">
    <div id="search-results" class="grid"></div>
  </div>

  <div id="library" class="tab-content">
    <h2 class="section-title">Playlists & Library</h2>
    <div class="mod-item" onclick="document.getElementById('file-input').click()">Import Local ALAC</div>
    <div id="lib-grid" class="grid"></div>
  </div>

  <div id="modules" class="tab-content">
    <h2 class="section-title">8SPINE Modules</h2>
    <div id="module-list"></div>
    <button class="card" style="width:100%; margin-top:10px; border:1px dashed #444;" onclick="document.getElementById('mod-input').click()">+ Load .8SPINE Module</button>
  </div>

  <div id="mini-player" onclick="app.openFullPlayer()">
    <img id="m-art">
    <div style="flex:1; margin-left:12px; overflow:hidden;">
      <div id="m-title" class="t-name">Core Ready</div>
      <div id="m-artist" class="t-sub">Select track</div>
    </div>
    <button style="background:none; border:none; color:#fff;"><svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  </div>

  <nav id="tab-bar">
    <button class="tab-btn active" onclick="app.tab('home')"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</button>
    <button class="tab-btn" onclick="app.tab('discover')"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>Discover</button>
    <button class="tab-btn" onclick="app.tab('search')"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>Search</button>
    <button class="tab-btn" onclick="app.tab('library')"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>Library</button>
    <button class="tab-btn" onclick="app.tab('modules')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 12c0-1.1-.9-2-2-2h-3c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2v-3zM10 12c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2v-3zM10 4c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2V4zm10 0c0-1.1-.9-2-2-2h-3c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2V4z"/></svg>Modules</button>
  </nav>

  <input type="file" id="mod-input" hidden accept=".8spine,.js">
  <input type="file" id="file-input" hidden multiple>

  <script>
    // 8SPINE BRIDGE: Injected globally for Qobuz/Tidal/Deezer module support
    window._bridge = {
        updateMeta: (t, a, alb, art) => {
            document.getElementById('m-title').textContent = t;
            document.getElementById('m-artist').textContent = a;
            if(art) document.getElementById('m-art').src = art;
        },
        setAudioUrl: (url) => { app.audio.src = url; app.audio.play(); },
        getAudioContext: () => new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 192000 }),
        toast: (m) => console.log("[Bridge]", m)
    };

    class LosslessCore {
      constructor() {
        this.audio = new Audio();
        this.modules = [];
        this.init();
      }

      init() {
        document.getElementById('mod-input').onchange = (e) => this.loadMod(e.target.files[0]);
        document.getElementById('search-bar').oninput = (e) => this.search(e.target.value);
        this.loadDiscovery();
      }

      tab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
      }

      async loadMod(file) {
        const code = await file.text();
        const s = document.createElement('script');
        s.textContent = code;
        document.head.appendChild(s);
        this.modules.push(file.name);
        this.renderMods();
      }

      renderMods() {
        document.getElementById('module-list').innerHTML = this.modules.map(m => `
          <div class="mod-item"><span>${m}</span><span class="mod-status">ACTIVE</span></div>
        `).join('');
      }

      async search(q) {
        if(q.length < 3) return;
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=15`);
        const data = await res.json();
        document.getElementById('search-results').innerHTML = data.results.map(t => `
          <div class="card" onclick="_bridge.updateMeta('${t.trackName.replace(/'/g,"")}','${t.artistName}','','${t.artworkUrl100.replace('100x100','600x600')}')">
            <img src="${t.artworkUrl100.replace('100x100','300x300')}">
            <div class="t-name">${t.trackName}</div><div class="t-sub">${t.artistName}</div>
          </div>
        `).join('');
      }

      async loadDiscovery() {
        const res = await fetch(`https://itunes.apple.com/search?term=lossless&entity=song&limit=6`);
        const data = await res.json();
        document.getElementById('discover-grid').innerHTML = data.results.map(t => `
          <div class="card">
            <img src="${t.artworkUrl100.replace('100x100','600x600')}">
            <div class="t-name">${t.trackName}</div><div class="t-sub">${t.artistName}</div>
          </div>
        `).join('');
      }
    }

    const app = new LosslessCore();
  </script>
</body>
</html>
